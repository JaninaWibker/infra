# config.yml - Registry configuration with htpasswd auth
version: 0.1

storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
  cache:
    blobdescriptor: inmemory

auth:
  htpasswd:
    realm: "Docker Registry"
    path: /auth/htpasswd

http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]

health:
  storagedriver:
    enabled: true
    interval: 30s
    threshold: 3
