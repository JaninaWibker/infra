providers:
  providersThrottleDuration: '10s'
  docker:
    exposedByDefault: false

api:
  dashboard: false
  insecure: true

entryPoints:
  #  dashboard:
  #    address: ":8080"
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: 'websecure'
          scheme: 'https'
          permanent: true
  websecure:
    address: ':443'

certificatesResolvers:
  leresolver:
    acme:
      email: 'me@janina.lol'
      storage: '/letsencrypt/acme.json'
      #caServer: https://acme-v02.api.letsencrypt.org/directory
      #caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      httpChallenge:
        entryPoint: 'web'
