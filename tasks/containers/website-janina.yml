- name: 'Ensure logged into own docker registry'
  community.docker.docker_login:
    registry_url: 'registry.{{ base_url }}'
    username: '{{ registry.login.USERNAME }}'
    password: '{{ registry.login.PASSWORD }}'
    reauthorize: true

- name: 'Ensure docker image for website-janina is pulled correctly'
  register: image_pull
  community.docker.docker_image_pull:
    name: 'registry.janina.lol/website-janina:latest'

- name: 'Ensure docker image for website-janina is tagged correctly'
  community.docker.docker_image_tag:
    existing_images: 'overwrite'
    name: 'registry.janina.lol/website-janina:latest' # input tag
    repository: # output tag(s)
      - 'website-janina:latest'
      - 'registry.janina.lol/website-janina:latest'

- name: 'Ensure website-janina is running'
  community.docker.docker_compose_v2:
    project_src: '/home/{{ username }}/docker-images/website-janina'
    env_files:
      - '/home/{{ username }}/docker-images/.env'
    recreate: "{{ (repo.changed) | ternary('always', 'auto') }}"
    build: "{{ (repo.changed) | ternary('always', 'policy') }}"

- name: 'Ensure logged out of own docker registry'
  community.docker.docker_login:
    state: absent
